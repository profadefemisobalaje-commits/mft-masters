  <text x="632.0" y="174.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Ade fails an exam</text>
  <text x="632.0" y="192.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">tension rises</text>
  <rect x="755.0" y="150.0" width="145.0" height="60.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" opacity="1.0"/>
  <text x="827.0" y="174.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Parents argue</text>
  <text x="827.0" y="192.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">about discipline</text>
  <rect x="755.0" y="268.0" width="145.0" height="60.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
