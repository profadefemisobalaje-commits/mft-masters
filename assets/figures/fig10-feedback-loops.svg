  <text x="827.0" y="310.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">worsens</text>
  <rect x="560.0" y="268.0" width="145.0" height="60.0" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" opacity="1.0"/>
