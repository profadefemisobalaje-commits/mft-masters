  <path d="M 627.0 222.0 L 632.0 212.0 L 637.0 222.0 z" fill="#6d28d9"/>
  <text x="720.0" y="356.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">Positive feedback (amplifying): deviation is increased.</text>
  <rect x="40.0" y="424.0" width="900.0" height="71.8" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="443.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="464.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">Both types are always present. Therapy usually adds a negative-feedback loop where an amplifying one is running — for example, a</text>
  <text x="54.0" y="480.9" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">bedtime routine that interrupts the 'he won't sleep → we argue → he is anxious → he won't sleep' spiral.</text>
