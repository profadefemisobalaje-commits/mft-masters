  <line x1="753.0" y1="298.0" x2="707.0" y2="298.0" stroke="#b45309" stroke-width="1.8"/>
  <path d="M 717.0 303.0 L 707.0 298.0 L 717.0 293.0 z" fill="#b45309"/>
