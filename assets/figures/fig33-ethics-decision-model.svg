<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9f1239"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="680" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">An Ethics Decision-Making Model</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Work the steps in order and write down what you decided and why</text>
  <rect x="90.0" y="520.0" width="640.0" height="46.0" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" opacity="1.0"/>
  <rect x="90.0" y="520.0" width="7.0" height="46.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="112.0" y="548.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">1. Identify the dilemma</text>
  <text x="326.0" y="548.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">What exactly is the conflict? Facts, not assumptions.</text>
  <rect x="116.0" y="462.0" width="620.0" height="46.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" opacity="1.0"/>
  <rect x="116.0" y="462.0" width="7.0" height="46.0" rx="3" fill="#1d4ed8" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="138.0" y="490.0" fill="#1d4ed8" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">2. Check the codes</text>
  <text x="352.0" y="490.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">Professional code, law, employer policy, cultural norms.</text>
  <rect x="142.0" y="404.0" width="600.0" height="46.0" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5" opacity="1.0"/>
  <rect x="142.0" y="404.0" width="7.0" height="46.0" rx="3" fill="#15803d" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="164.0" y="432.0" fill="#15803d" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">3. Consult</text>
  <text x="378.0" y="432.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">A trusted senior colleague, supervisor, ethics committee.</text>
  <rect x="168.0" y="346.0" width="580.0" height="46.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <rect x="168.0" y="346.0" width="7.0" height="46.0" rx="3" fill="#b45309" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="190.0" y="374.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">4. Generate options</text>
  <text x="404.0" y="374.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">At least three, including the uncomfortable one.</text>
  <rect x="194.0" y="288.0" width="560.0" height="46.0" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" opacity="1.0"/>
  <rect x="194.0" y="288.0" width="7.0" height="46.0" rx="3" fill="#6d28d9" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="216.0" y="316.0" fill="#6d28d9" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">5. Weigh consequences</text>
  <text x="430.0" y="316.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">Who is affected? Harm, rights, duties, power.</text>
  <rect x="220.0" y="230.0" width="540.0" height="46.0" rx="8" fill="#ffffff" stroke="#9f1239" stroke-width="1.5" opacity="1.0"/>
  <rect x="220.0" y="230.0" width="7.0" height="46.0" rx="3" fill="#9f1239" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="242.0" y="258.0" fill="#9f1239" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">6. Decide and act</text>
  <text x="456.0" y="258.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">Choose, document, and tell the client what you are doing.</text>
  <rect x="246.0" y="172.0" width="520.0" height="46.0" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
  <rect x="246.0" y="172.0" width="7.0" height="46.0" rx="3" fill="#334155" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="268.0" y="200.0" fill="#334155" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:700;">7. Evaluate</text>
  <text x="482.0" y="200.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.6px;font-weight:400;">What happened? Would you decide the same again?</text>
  <rect x="740.0" y="120.0" width="210.0" height="470.0" rx="12" fill="#f8fafc" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <text x="845.0" y="148.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1px;">WHEN IN DOUBT</text>
  <text x="845.0" y="184.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">• Is the client safe?</text>
  <text x="845.0" y="236.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">• Would I be</text>
  <text x="845.0" y="250.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">comfortable if this</text>
  <text x="845.0" y="264.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">were published?</text>
  <text x="845.0" y="288.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">• Whose needs am I</text>
  <text x="845.0" y="302.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">meeting?</text>
  <text x="845.0" y="340.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">• Have I documented</text>
  <text x="845.0" y="354.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">it?</text>
  <text x="845.0" y="392.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">• Is this within my</text>
  <text x="845.0" y="406.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">competence?</text>
  <text x="845.0" y="444.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">• Have I told the</text>
  <text x="845.0" y="458.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">client what I am</text>
  <text x="845.0" y="472.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">doing?</text>
  <rect x="40.0" y="606.0" width="900.0" height="67.7" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="625.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="646.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">The most common real-world dilemmas in MFT are not dramatic: a dual relationship through church or family ties, a request to keep a secret from a spouse,</text>
  <text x="54.0" y="660.9" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">an insurance form that does not fit the work, and a client who cannot pay. Each has a documented, defensible path.</text>
</svg>
