<svg xmlns="http://www.w3.org/2000/svg" width="980" height="645" viewBox="0 0 980 645" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9f1239"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="645" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">Solution-Focused Brief Therapy: The Session in Five Moves</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Assume competence; study the exceptions; keep the next step small</text>
  <rect x="60.0" y="108.0" width="860.0" height="86.0" rx="10" fill="#ffffff" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <circle cx="104.0" cy="151.0" r="20" fill="#0f766e" stroke="none" stroke-width="1.5"/>
  <text x="104.0" y="157.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">1</text>
  <text x="140.0" y="142.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Listen for strengths</text>
  <text x="140.0" y="166.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">What is already working? Who in the family has kept this from being worse?</text>
  <rect x="60.0" y="202.0" width="860.0" height="86.0" rx="10" fill="#ffffff" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <circle cx="104.0" cy="245.0" r="20" fill="#0f766e" stroke="none" stroke-width="1.5"/>
  <text x="104.0" y="251.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">2</text>
  <text x="140.0" y="236.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">The miracle question</text>
  <text x="140.0" y="260.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">"Suppose tonight, while you sleep, a miracle happens and the problem is solved. What will you</text>
  <text x="140.0" y="275.5" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">notice first tomorrow?"</text>
  <rect x="60.0" y="296.0" width="860.0" height="86.0" rx="10" fill="#ffffff" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <circle cx="104.0" cy="339.0" r="20" fill="#0f766e" stroke="none" stroke-width="1.5"/>
  <text x="104.0" y="345.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">3</text>
  <text x="140.0" y="330.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Scale the present</text>
  <text x="140.0" y="354.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">"On 0–10, where are you today? What would move you one point up — not to 10?"</text>
  <rect x="60.0" y="390.0" width="860.0" height="86.0" rx="10" fill="#ffffff" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <circle cx="104.0" cy="433.0" r="20" fill="#0f766e" stroke="none" stroke-width="1.5"/>
  <text x="104.0" y="439.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">4</text>
  <text x="140.0" y="424.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Explore exceptions</text>
  <text x="140.0" y="448.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">Tell me about a time the argument stayed small. What were you each doing differently?</text>
  <rect x="60.0" y="484.0" width="860.0" height="86.0" rx="10" fill="#ffffff" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <circle cx="104.0" cy="527.0" r="20" fill="#0f766e" stroke="none" stroke-width="1.5"/>
  <text x="104.0" y="533.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">5</text>
  <text x="140.0" y="518.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">End with a task</text>
  <text x="140.0" y="542.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">Notice and repeat what worked. Invite the family to do more of it before the next session.</text>
  <rect x="40.0" y="570.0" width="900.0" height="69.0" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="589.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="610.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">Nigerian clinical note: the miracle question can feel counter-cultural to families who expect expert direction. Follow it with a very concrete 'one small</text>
  <text x="54.0" y="625.5" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">step' so the family leaves with something to do, not just something to imagine.</text>
</svg>
