  <path d="M 757.0 250.0 L 762.0 240.0 L 767.0 250.0 z" fill="#9f1239"/>
  <text x="725.0" y="372.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">Every intervention is also feedback:</text>
  <text x="725.0" y="390.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">the family adapts to being watched.</text>
  <rect x="60.0" y="500.0" width="860.0" height="71.8" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="74.0" y="519.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="74.0" y="540.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">Clinical use: knowing which cybernetics you are operating from tells you whether to aim at 'fixing' a family (first-order) or at</text>
  <text x="74.0" y="556.9" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">co-creating new meanings and staying curious about your own effect on the system (second-order).</text>
</svg>
