  <text x="725.0" y="154.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;font-style:italic;">The observer is part of the observed system</text>
  <circle cx="725.0" cy="258.0" r="102" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="725.0" y="202.0" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">Family</text>
