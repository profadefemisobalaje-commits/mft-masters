<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="490" y="46" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;font-weight:700;">Measurement Invariance: Four Steps Before You Compare Two Groups</text>
  <text x="490" y="72" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;">The same 14 items can mean different things in two samples; invariance testing asks how far the meaning travels</text>

  <!-- baseline -->
  <line x1="60" y1="470" x2="920" y2="470" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="60" y="494" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Weaker claim</text>
  <text x="920" y="494" fill="#5b6675" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Stronger claim</text>
  <line x1="80" y1="440" x2="900" y2="440" stroke="#5b6675" stroke-width="1.4" marker-end="url(#ar-muted)"/>

  <!-- Step 1 -->
  <rect x="70" y="150" width="195" height="230" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="167" y="180" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">1. Configural</text>
  <text x="167" y="204" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">same items, same factors</text>
  <line x1="90" y1="216" x2="245" y2="216" stroke="#cbd5e1" stroke-width="1"/>
  <text x="167" y="238" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Free: loadings,</text>
  <text x="167" y="254" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">intercepts, means</text>
  <text x="167" y="286" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">Allows:</text>
  <text x="167" y="303" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">"the construct exists</text>
  <text x="167" y="319" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">in both groups"</text>
  <text x="167" y="348" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">nothing about</text>
  <text x="167" y="362" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">comparison yet</text>

  <!-- Step 2 -->
  <rect x="285" y="150" width="195" height="230" rx="10" fill="#eef6f5" stroke="#99c7c2" stroke-width="1.4"/>
  <text x="382" y="180" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">2. Metric</text>
  <text x="382" y="204" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">equal factor loadings</text>
  <line x1="305" y1="216" x2="460" y2="216" stroke="#99c7c2" stroke-width="1"/>
  <text x="382" y="238" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Fixed: each item weighs</text>
  <text x="382" y="254" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">the same in both groups</text>
  <text x="382" y="286" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">Allows:</text>
  <text x="382" y="303" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">comparing associations</text>
  <text x="382" y="319" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">(correlations, paths)</text>
  <text x="382" y="348" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">not mean levels</text>

  <!-- Step 3 -->
  <rect x="500" y="150" width="195" height="230" rx="10" fill="#fbf3e6" stroke="#dcbf8c" stroke-width="1.4"/>
  <text x="597" y="180" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">3. Scalar</text>
  <text x="597" y="204" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">equal intercepts</text>
  <line x1="520" y1="216" x2="675" y2="216" stroke="#dcbf8c" stroke-width="1"/>
  <text x="597" y="238" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Fixed: a score of 40</text>
  <text x="597" y="254" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">means the same in both</text>
  <text x="597" y="286" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">Allows:</text>
  <text x="597" y="303" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">comparing mean scores</text>
  <text x="597" y="319" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">across groups</text>
  <text x="597" y="348" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">the usual thesis</text>
  <text x="597" y="362" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">claim, rarely tested</text>

  <!-- Step 4 -->
  <rect x="715" y="150" width="195" height="230" rx="10" fill="#f4f2fb" stroke="#c4b8e6" stroke-width="1.4"/>
  <text x="812" y="180" fill="#6d28d9" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;">4. Residual</text>
  <text x="812" y="204" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">equal error variances</text>
  <line x1="735" y1="216" x2="890" y2="216" stroke="#c4b8e6" stroke-width="1"/>
  <text x="812" y="238" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Fixed: precision is</text>
  <text x="812" y="254" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">identical in both groups</text>
  <text x="812" y="286" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">Allows:</text>
  <text x="812" y="303" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">strict comparison of</text>
  <text x="812" y="319" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">observed and latent scores</text>
  <text x="812" y="348" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">seldom required</text>
  <text x="812" y="362" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:400;">for a thesis</text>

  <!-- arrows -->
  <line x1="265" y1="265" x2="283" y2="265" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-teal)"/>
  <line x1="480" y1="265" x2="498" y2="265" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-teal)"/>
  <line x1="695" y1="265" x2="713" y2="265" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-teal)"/>

  <!-- footer note -->
  <rect x="70" y="508" width="840" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="86" y="530" fill="#1f2937" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Practical rule for a masters thesis:</text>
  <text x="86" y="550" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Test configural and metric invariance if you can; report what you found. If scalar invariance fails, do not compare means —</text>
  <text x="86" y="566" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">compare within-group associations instead, and say why. A failed invariance test is a finding about translation, not a failure of the study.</text>
</svg>
