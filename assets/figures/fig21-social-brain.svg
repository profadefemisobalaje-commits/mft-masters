  <text x="252.0" y="140.0" fill="#0f766e" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;">Prefrontal cortex</text>
  <text x="252.0" y="157.0" fill="#5b6675" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">perspective-taking, inhibition, reappraisal</text>
  <line x1="392.0" y1="276.0" x2="714.0" y2="146.0" stroke="#b45309" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="720.0" y="150.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;">Insula</text>
  <text x="720.0" y="167.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">visceral feeling; the 'gut sense' of another person</text>
  <line x1="366.0" y1="310.0" x2="714.0" y2="242.0" stroke="#1d4ed8" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="720.0" y="246.0" fill="#1d4ed8" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;">Anterior cingulate</text>
  <text x="720.0" y="263.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">social pain and exclusion; fires like physical pain</text>
  <line x1="432.0" y1="344.0" x2="714.0" y2="338.0" stroke="#9f1239" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="720.0" y="342.0" fill="#9f1239" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;">Amygdala</text>
  <text x="720.0" y="359.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">fast, pre-verbal threat detection</text>
  <line x1="498.0" y1="344.0" x2="714.0" y2="434.0" stroke="#6d28d9" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="720.0" y="438.0" fill="#6d28d9" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;">Hippocampus</text>
  <text x="720.0" y="455.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">context and memory; shrinks under chronic stress</text>
  <rect x="40.0" y="512.0" width="900.0" height="67.7" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="531.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="552.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Translation into practice: rejection activates pain circuitry (Eisenberger's social-pain findings), which is why contempt lands physically. A stressed</text>
  <text x="54.0" y="566.9" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">hippocampus also files the argument as a general rule rather than a single event — so reframing is not politeness, it changes what gets encoded.</text>
