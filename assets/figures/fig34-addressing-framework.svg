  <text x="54.0" y="612.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Use it as an interview, not a checklist: 'In your family, who usually decides? Who is consulted? What does your faith say about this problem? What language</text>
