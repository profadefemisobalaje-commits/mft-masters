<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="490" y="42" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:22px;font-weight:700;">Reading a Forest Plot Against a Clinical Threshold</text>
  <text x="490" y="66" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:400;">Each row is one study's estimate and 95% interval; the dashed line is the minimal clinically important difference</text>

  <!-- axis -->
  <line x1="330" y1="430" x2="900" y2="430" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar-ink)"/>
  <text x="900" y="452" fill="#1f2937" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;">standardised effect (d)</text>
  <g style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;" fill="#5b6675">
    <line x1="330" y1="425" x2="330" y2="435" stroke="#1f2937" stroke-width="1.2"/><text x="330" y="421" text-anchor="middle">0</text>
    <line x1="449" y1="425" x2="449" y2="435" stroke="#1f2937" stroke-width="1.2"/><text x="449" y="421" text-anchor="middle">0.2</text>
    <line x1="568" y1="425" x2="568" y2="435" stroke="#1f2937" stroke-width="1.2"/><text x="568" y="421" text-anchor="middle">0.4</text>
    <line x1="687" y1="425" x2="687" y2="435" stroke="#1f2937" stroke-width="1.2"/><text x="687" y="421" text-anchor="middle">0.6</text>
    <line x1="806" y1="425" x2="806" y2="435" stroke="#1f2937" stroke-width="1.2"/><text x="806" y="421" text-anchor="middle">0.8</text>
    <line x1="330" y1="95" x2="330" y2="430" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>
  </g>

  <!-- MCID line at 0.6 -->
  <line x1="687" y1="95" x2="687" y2="418" stroke="#9f1239" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="694" y="112" fill="#9f1239" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;">MCID ≈ d 0.60</text>

  <!-- rows -->
  <!-- Study 1: 0.35 [0.12,0.58] -> x: 330 + d*595 -->
  <text x="60" y="152" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Infidelity recovery group (n=73)</text>
  <text x="60" y="168" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;">d 0.35 [0.12, 0.58]</text>
  <line x1="401" y1="157" x2="675" y2="157" stroke="#0f766e" stroke-width="2"/>
  <line x1="401" y1="150" x2="401" y2="164" stroke="#0f766e" stroke-width="2"/>
  <line x1="675" y1="150" x2="675" y2="164" stroke="#0f766e" stroke-width="2"/>
  <circle cx="538" cy="157" r="6" fill="#0f766e"/>

  <!-- Study 2: 0.12 [-0.18,0.42] -->
  <text x="60" y="222" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Church enrichment programme (n=366 couples)</text>
  <text x="60" y="238" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;">d 0.12 [−0.18, 0.42]</text>
  <line x1="223" y1="227" x2="580" y2="227" stroke="#b45309" stroke-width="2"/>
  <line x1="223" y1="220" x2="223" y2="234" stroke="#b45309" stroke-width="2"/>
  <line x1="580" y1="220" x2="580" y2="234" stroke="#b45309" stroke-width="2"/>
  <circle cx="401" cy="227" r="6" fill="#b45309"/>
  <text x="892" y="231" fill="#9f1239" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:600;">interval crosses 0: not established</text>

  <!-- Study 3: 0.62 [0.41,0.83] -->
  <text x="60" y="292" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Emotionally focused therapy (n=48)</text>
  <text x="60" y="308" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;">d 0.62 [0.41, 0.83]</text>
  <line x1="574" y1="297" x2="824" y2="297" stroke="#0f766e" stroke-width="2"/>
  <line x1="574" y1="290" x2="574" y2="304" stroke="#0f766e" stroke-width="2"/>
  <line x1="824" y1="290" x2="824" y2="304" stroke="#0f766e" stroke-width="2"/>
  <circle cx="699" cy="297" r="6" fill="#0f766e"/>
  <text x="892" y="318" fill="#0f766e" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:600;">entire interval above MCID</text>

  <!-- Study 4: 0.18 [-0.05,0.41] -->
  <text x="60" y="362" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Brief psychoeducation (n=120)</text>
  <text x="60" y="378" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;">d 0.18 [−0.05, 0.41]</text>
  <line x1="300" y1="367" x2="574" y2="367" stroke="#b45309" stroke-width="2"/>
  <line x1="300" y1="360" x2="300" y2="374" stroke="#b45309" stroke-width="2"/>
  <line x1="574" y1="360" x2="574" y2="374" stroke="#b45309" stroke-width="2"/>
  <circle cx="437" cy="367" r="6" fill="#b45309"/>

  <!-- footer note -->
  <rect x="60" y="466" width="860" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="76" y="486" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.8px;font-weight:400;">A statistically significant row (upper two) can sit entirely below the clinical threshold, and a row whose interval crosses it (bottom) leaves the clinical question open.</text>
  <text x="76" y="500" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">Report the estimate, the interval, and the distance to the threshold — in that order, in every table.</text>
</svg>
