  <rect x="60.0" y="110.0" width="380.0" height="5.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94.0" cy="152.0" r="15" fill="#0f766e" stroke="none" stroke-width="1.5"/>
  <text x="94.0" y="157.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">1</text>
  <text x="120.0" y="150.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Aisha feels unheard</text>
  <text x="120.0" y="174.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">tracks Sam's distance; asks</text>
  <text x="120.0" y="193.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">'why are you so quiet?'</text>
  <rect x="540.0" y="110.0" width="380.0" height="120.0" rx="14" fill="#ffffff" stroke="#9f1239" stroke-width="1.5" opacity="1.0"/>
  <rect x="540.0" y="110.0" width="380.0" height="5.0" rx="3" fill="#9f1239" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <circle cx="574.0" cy="152.0" r="15" fill="#9f1239" stroke="none" stroke-width="1.5"/>
  <text x="574.0" y="157.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">2</text>
  <text x="600.0" y="150.0" fill="#9f1239" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Aisha protests</text>
  <text x="600.0" y="174.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">criticism, pursuit:</text>
  <text x="600.0" y="193.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">'we never talk any more'</text>
  <rect x="540.0" y="350.0" width="380.0" height="120.0" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" opacity="1.0"/>
  <rect x="540.0" y="350.0" width="380.0" height="5.0" rx="3" fill="#6d28d9" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <circle cx="574.0" cy="392.0" r="15" fill="#6d28d9" stroke="none" stroke-width="1.5"/>
  <text x="574.0" y="397.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">3</text>
  <text x="600.0" y="390.0" fill="#6d28d9" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Sam withdraws</text>
  <text x="600.0" y="414.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">TV, phone, late nights,</text>
  <text x="600.0" y="433.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">'here we go again'</text>
  <rect x="60.0" y="350.0" width="380.0" height="120.0" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" opacity="1.0"/>
  <rect x="60.0" y="350.0" width="380.0" height="5.0" rx="3" fill="#1d4ed8" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <circle cx="94.0" cy="392.0" r="15" fill="#1d4ed8" stroke="none" stroke-width="1.5"/>
  <text x="94.0" y="397.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">4</text>
  <text x="120.0" y="390.0" fill="#1d4ed8" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Sam feels criticised</text>
  <text x="120.0" y="414.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">shuts down to keep the peace</text>
  <text x="120.0" y="433.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">and avoid a fight</text>
  <circle cx="490.0" cy="290.0" r="72" fill="#334155" stroke="none" stroke-width="1.5"/>
  <text x="490.0" y="282.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">The loop</text>
  <text x="490.0" y="302.0" fill="#cbd5e1" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">is the client</text>
