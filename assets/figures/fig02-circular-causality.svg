  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">Circular Causality: The Pursue–Withdraw Loop</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">No single villain: each response is the cause and consequence of the other</text>
