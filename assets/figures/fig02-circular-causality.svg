  <text x="490.0" y="148.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">pursuit</text>
  <text x="756.0" y="292.0" fill="#6d28d9" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">withdrawal</text>
  <text x="490.0" y="436.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">protection</text>
  <text x="222.0" y="292.0" fill="#0f766e" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">renewed</text>
  <text x="222.0" y="308.0" fill="#0f766e" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">pursuit</text>
  <rect x="40.0" y="500.0" width="900.0" height="69.0" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="519.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="540.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">Reframe in session: 'So the more you reach for him, the more he steps back; and the more he steps back, the more you reach. Neither of you</text>
  <text x="54.0" y="555.5" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">invented this alone.' The reframe converts a character complaint into a pattern that both partners can change.</text>
  <text x="490.0" y="596.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;font-style:italic;">Each arrow is also a cause: your response is the trigger for my next move.</text>
</svg>
