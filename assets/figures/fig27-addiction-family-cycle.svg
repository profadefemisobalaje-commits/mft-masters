  <text x="470.0" y="336.0" fill="#cbd5e1" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">adapts around it</text>
