  <text x="54.0" y="646.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">Carter and McGoldrick's framework is descriptive, not prescriptive: in many Nigerian and other African households, stages overlap (a</text>
  <text x="54.0" y="662.9" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">grandparent fostering a child, an adult sibling living in), and 'launching' may be cyclical rather than linear. Treat the stages as questions</text>
