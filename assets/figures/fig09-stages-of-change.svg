  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">The Stages of Change (Transtheoretical Model)</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Match your intervention to the stage — advice given too early produces resistance</text>
  <circle cx="490.0" cy="330.0" r="195" fill="#f8fafc" stroke="#c7d0da" stroke-width="1.4"/>
  <circle cx="490.0" cy="330.0" r="78" fill="#ffffff" stroke="#c7d0da" stroke-width="1.5"/>
  <text x="490.0" y="324.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">Relapse</text>
  <text x="490.0" y="344.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">is data, not failure</text>
  <rect x="408.0" y="101.0" width="164.0" height="68.0" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" opacity="1.0"/>
  <text x="490.0" y="129.0" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;">Pre-contemplation</text>
  <text x="490.0" y="150.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">not thinking about it</text>
  <rect x="593.5" y="235.7" width="164.0" height="68.0" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" opacity="1.0"/>
  <text x="675.5" y="263.7" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;">Contemplation</text>
  <text x="675.5" y="284.7" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">ambivalent, weighing it up</text>
  <rect x="522.6" y="453.8" width="164.0" height="68.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="1.5" opacity="1.0"/>
  <text x="604.6" y="481.8" fill="#15803d" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;">Preparation</text>
  <text x="604.6" y="502.8" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">planning a change</text>
  <rect x="293.4" y="453.8" width="164.0" height="68.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="375.4" y="481.8" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;">Action</text>
  <text x="375.4" y="502.8" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">doing it, first 6 months</text>
  <rect x="222.5" y="235.7" width="164.0" height="68.0" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" opacity="1.0"/>
  <text x="304.5" y="263.7" fill="#6d28d9" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;">Maintenance</text>
  <text x="304.5" y="284.7" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">sustaining, 6 months+</text>
