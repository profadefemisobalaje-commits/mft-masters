<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="44" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:23px;font-weight:700;">The Actor–Partner Interdependence Model</text>
  <text x="490" y="70" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;">Two people, four paths: my predictor on my outcome, and my predictor on my partner's outcome</text>

  <!-- Husband predictor -->
  <rect x="70" y="130" width="200" height="66" rx="8" fill="#eef6f5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="170" y="158" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:700;">Husband's criticism</text>
  <text x="170" y="178" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;">X (husband)</text>

  <!-- Wife predictor -->
  <rect x="70" y="330" width="200" height="66" rx="8" fill="#eef6f5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="170" y="358" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:700;">Wife's criticism</text>
  <text x="170" y="378" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;">X (wife)</text>

  <!-- Husband outcome -->
  <rect x="700" y="130" width="210" height="66" rx="8" fill="#fbf3e6" stroke="#b45309" stroke-width="1.6"/>
  <text x="805" y="158" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:700;">Husband's satisfaction</text>
  <text x="805" y="178" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;">Y (husband)</text>

  <!-- Wife outcome -->
  <rect x="700" y="330" width="210" height="66" rx="8" fill="#fbf3e6" stroke="#b45309" stroke-width="1.6"/>
  <text x="805" y="358" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:700;">Wife's satisfaction</text>
  <text x="805" y="378" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;">Y (wife)</text>

  <!-- actor paths -->
  <line x1="272" y1="163" x2="696" y2="163" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ar-teal)"/>

  <line x1="272" y1="363" x2="696" y2="363" stroke="#0f766e" stroke-width="2.4" marker-end="url(#ar-teal)"/>

  <!-- partner paths -->
  <path d="M 272 190 C 430 250 560 300 700 340" fill="none" stroke="#b45309" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar-gold)"/>
  <path d="M 272 336 C 430 276 560 226 700 186" fill="none" stroke="#b45309" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar-gold)"/>

  <text x="686" y="150" fill="#0f766e" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;font-style:italic;">a</text>
  <text x="686" y="350" fill="#0f766e" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;font-style:italic;">a</text>
  <text x="686" y="322" fill="#b45309" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;font-style:italic;">p</text>
  <text x="686" y="214" fill="#b45309" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;font-style:italic;">p</text>
  <!-- residual correlation -->
  <line x1="700" y1="163" x2="700" y2="363" stroke="#5b6675" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="716" y="252" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">disturbance correlation:</text>
  <text x="716" y="268" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">the non-independence</text>
  <text x="716" y="282" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">OLS assumes away</text>

  <text x="880" y="418" fill="#5b6675" text-anchor="end" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;"><tspan fill="#0f766e" font-weight="700">solid a</tspan> = actor effect   ·   <tspan fill="#b45309" font-weight="700">dashed p</tspan> = partner effect</text>
  <!-- footer -->
  <rect x="70" y="440" width="840" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="86" y="464" fill="#1f2937" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">Reading the four paths in a family clinic:</text>
  <text x="86" y="484" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Actor: my criticism lowers my own satisfaction. Partner: my criticism lowers my partner's satisfaction, net of the partner's own criticism.</text>
  <text x="86" y="502" fill="#334155" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">A significant partner effect is the statistically visible form of a familiar clinical fact: in a couple, nobody's behaviour stops at their own skin.</text>
  <text x="86" y="518" fill="#5b6675" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">Fixed at 0, the actor–partner covariance tests whether the two partners influence each other symmetrically.</text>
</svg>
