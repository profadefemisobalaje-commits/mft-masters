  <text x="54.0" y="628.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Assessment question: 'On a scale of 0–10, how satisfied are you with each of these eight?' Plot both partners' scores. Discrepancy is information, not</text>
