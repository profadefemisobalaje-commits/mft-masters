<svg xmlns="http://www.w3.org/2000/svg" width="980" height="627" viewBox="0 0 980 627" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9f1239"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="627" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">The Window of Tolerance</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Trauma narrows the band in which a person can think, feel and stay relational</text>
  <rect x="70.0" y="110.0" width="620.0" height="130.0" rx="10" fill="#fce8ee" stroke="#f0c9d5" stroke-width="1.5" opacity="1.0"/>
  <text x="96.0" y="140.0" fill="#9f1239" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:0.8px;">HYPERAROUSAL</text>
  <text x="96.0" y="166.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">fight / flight: panic, rage, hypervigilance, intrusive images, restlessness</text>
  <rect x="70.0" y="240.0" width="620.0" height="160.0" rx="10" fill="#e8f5ec" stroke="#bcdcc6" stroke-width="1.5" opacity="1.0"/>
  <text x="96.0" y="272.0" fill="#15803d" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:0.8px;">WINDOW OF TOLERANCE</text>
  <text x="96.0" y="298.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">regulated: can think, feel, choose, connect, learn</text>
  <rect x="70.0" y="400.0" width="620.0" height="130.0" rx="10" fill="#e8eefc" stroke="#c7d6f4" stroke-width="1.5" opacity="1.0"/>
  <text x="96.0" y="430.0" fill="#1d4ed8" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:0.8px;">HYPOAROUSAL</text>
  <text x="96.0" y="456.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">freeze / collapse: numbness, dissociation, shutdown, shame, exhaustion</text>
  <path d="M 730 130 C 700 240, 700 400, 730 510" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="790.0" y="300.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;">Trauma and chronic stress</text>
  <text x="790.0" y="322.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;">narrow the window</text>
  <line x1="770.0" y1="360.0" x2="700.0" y2="330.0" stroke="#334155" stroke-width="1.5"/>
  <path d="M 707.2 338.5 L 700.0 330.0 L 711.2 329.3 z" fill="#334155"/>
  <text x="790.0" y="380.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">Safety, co-regulation and</text>
  <text x="790.0" y="400.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">skills widen it again</text>
  <line x1="770.0" y1="424.0" x2="700.0" y2="400.0" stroke="#15803d" stroke-width="1.5"/>
  <path d="M 707.8 408.0 L 700.0 400.0 L 711.1 398.5 z" fill="#15803d"/>
  <rect x="40.0" y="552.0" width="900.0" height="69.0" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="571.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="592.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">In-session signal: watch for breath-holding, flushing, freezing, gaze change or sudden compliance. Those are not 'resistance' — they are the nervous</text>
  <text x="54.0" y="607.5" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">system leaving the room. Slow down, orient to the present, and offer choice.</text>
</svg>
