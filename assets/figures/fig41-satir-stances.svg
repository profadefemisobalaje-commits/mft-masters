<svg xmlns="http://www.w3.org/2000/svg" width="980" height="716" viewBox="0 0 980 716" role="img">
  <rect x="0" y="0" width="980" height="716" fill="#ffffff"/>
  <text x="490" y="48" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">Satir's Five Communication Stances</text>
  <text x="490" y="74" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Four ways of managing the threat of another person's response, and the one the therapy aims at</text>
  <rect x="40.0" y="100.0" width="900.0" height="96.0" rx="10" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
  <rect x="40.0" y="100.0" width="6.0" height="96.0" rx="3" fill="#9f1239"/>
  <circle cx="78.0" cy="144.0" r="17" fill="#9f1239"/>
  <text x="78" y="150" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">1</text>
  <text x="108" y="132" fill="#9f1239" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:700;">Placating</text>
  <text x="108" y="156" fill="#1f2937" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;font-style:italic;">'Whatever you want. I am nothing without you.'</text>
  <text x="108" y="178" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Body: nodding, hands out, voice rising at the end. Cost: the self disappears from the relationship.</text>
  <rect x="40.0" y="206.0" width="900.0" height="96.0" rx="10" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
  <rect x="40.0" y="206.0" width="6.0" height="96.0" rx="3" fill="#b45309"/>
  <circle cx="78.0" cy="250.0" r="17" fill="#b45309"/>
  <text x="78" y="256" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">2</text>
  <text x="108" y="238" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:700;">Blaming</text>
  <text x="108" y="262" fill="#1f2937" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;font-style:italic;">'It is your fault. You are the problem.'</text>
  <text x="108" y="284" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Body: pointing, leaning forward, jaw set. Cost: the other person must be wrong for the self to be safe.</text>
  <rect x="40.0" y="312.0" width="900.0" height="96.0" rx="10" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
  <rect x="40.0" y="312.0" width="6.0" height="96.0" rx="3" fill="#1d4ed8"/>
  <circle cx="78.0" cy="356.0" r="17" fill="#1d4ed8"/>
  <text x="78" y="362" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">3</text>
  <text x="108" y="344" fill="#1d4ed8" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:700;">Super-reasonable</text>
  <text x="108" y="368" fill="#1f2937" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;font-style:italic;">'Let us be logical. Feelings are not relevant.'</text>
  <text x="108" y="390" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Body: still, flat, upright, eyes on a middle distance. Cost: nobody in the room is met.</text>
  <rect x="40.0" y="418.0" width="900.0" height="96.0" rx="10" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
  <rect x="40.0" y="418.0" width="6.0" height="96.0" rx="3" fill="#6d28d9"/>
  <circle cx="78.0" cy="462.0" r="17" fill="#6d28d9"/>
  <text x="78" y="468" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">4</text>
  <text x="108" y="450" fill="#6d28d9" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:700;">Irrelevant</text>
  <text x="108" y="474" fill="#1f2937" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;font-style:italic;">'Anyway — did you see the match last night?'</text>
  <text x="108" y="496" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Body: shifting, joking, changing the subject. Cost: the moment of contact never arrives.</text>
  <rect x="40.0" y="524.0" width="900.0" height="96.0" rx="10" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
  <rect x="40.0" y="524.0" width="6.0" height="96.0" rx="3" fill="#0f766e"/>
  <circle cx="78.0" cy="568.0" r="17" fill="#0f766e"/>
  <text x="78" y="574" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;">5</text>
  <text x="108" y="556" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:700;">Congruent</text>
  <text x="108" y="580" fill="#1f2937" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;font-style:italic;">'I felt frightened when you shouted, and I am telling you now.'</text>
  <text x="108" y="602" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">Body: still, breathing, eyes on the other person. Cost: the risk is real, and it is taken.</text>
  <rect x="40.0" y="634.0" width="900.0" height="70.0" rx="10" fill="#eef6f5" stroke="#cfe3e0" stroke-width="1.5"/>
  <text x="54" y="655" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54" y="676" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">The stances are survival strategies, not personality types: each protects the relationship by sacrificing the truth. Therapy raises self-worth</text>
  <text x="54" y="692" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;">enough to make the fifth stance survivable.</text>
</svg>
