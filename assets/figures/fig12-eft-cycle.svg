<svg xmlns="http://www.w3.org/2000/svg" width="980" height="696" viewBox="0 0 980 696" role="img">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9f1239"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="696" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:23.5px;font-weight:700;">The EFT Cycle: Secondary Emotion Hides Primary Attachment Need</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Emotionally Focused Therapy (Sue Johnson) maps the loop beneath the argument</text>
  <rect x="40.0" y="96.0" width="400.0" height="250.0" rx="14" fill="#fce8ee" stroke="#f0c9d5" stroke-width="1.5" opacity="1.0"/>
  <text x="240.0" y="122.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.8px;">PURSUER  (Aisha)</text>
  <text x="240.0" y="152.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;font-style:italic;">Action tendency</text>
  <text x="240.0" y="174.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;">protest, criticise, chase</text>
  <text x="240.0" y="204.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;font-style:italic;">Secondary emotion (on the surface)</text>
  <text x="240.0" y="226.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;">anger · frustration · resentment</text>
  <text x="240.0" y="256.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;font-style:italic;">Primary emotion (underneath)</text>
  <text x="240.0" y="278.0" fill="#6d28d9" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;">fear of abandonment · loneliness</text>
  <text x="240.0" y="312.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;font-style:italic;">Attachment cry: 'Are you there for me?'</text>
  <rect x="540.0" y="96.0" width="400.0" height="250.0" rx="14" fill="#e8eefc" stroke="#c7d6f4" stroke-width="1.5" opacity="1.0"/>
  <text x="740.0" y="122.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.8px;">WITHDRAWER  (Sam)</text>
  <text x="740.0" y="152.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;font-style:italic;">Action tendency</text>
  <text x="740.0" y="174.0" fill="#1f2937" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;">shut down, avoid, go quiet</text>
  <text x="740.0" y="204.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;font-style:italic;">Secondary emotion (on the surface)</text>
  <text x="740.0" y="226.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;">numbness · irritation · distance</text>
  <text x="740.0" y="256.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;font-style:italic;">Primary emotion (underneath)</text>
  <text x="740.0" y="278.0" fill="#6d28d9" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;">shame · fear of failure · helplessness</text>
  <text x="740.0" y="312.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;font-style:italic;">Attachment cry: 'I can never get it right.'</text>
  <line x1="300.0" y1="366.0" x2="620.0" y2="430.0" stroke="#9f1239" stroke-width="2.6"/>
  <path d="M 611.2 423.1 L 620.0 430.0 L 609.2 432.9 z" fill="#9f1239"/>
  <text x="410.0" y="388.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">pursue to get a response</text>
  <line x1="700.0" y1="470.0" x2="360.0" y2="512.0" stroke="#1d4ed8" stroke-width="2.6"/>
  <path d="M 370.5 515.7 L 360.0 512.0 L 369.3 505.8 z" fill="#1d4ed8"/>
  <text x="540.0" y="500.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:600;">withdraw to keep the peace</text>
  <rect x="230.0" y="520.0" width="520.0" height="86.0" rx="14" fill="#334155" stroke="none" stroke-width="1.5" opacity="1.0"/>
  <text x="490.0" y="548.0" fill="#ffffff" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:0.6px;">THE NEGATIVE CYCLE IS THE ENEMY — NOT YOUR PARTNER</text>
  <text x="490.0" y="574.0" fill="#cbd5e1" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;">EFT moves: de-escalate → restructure the bond → consolidate</text>
  <rect x="40.0" y="620.0" width="900.0" height="70.4" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="639.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="660.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;">In session you do not argue with the anger. You slow the film: 'When she sounds angry, what happens inside you?' — and then, to the other:</text>
  <text x="54.0" y="676.2" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;">'Can you hear that he disappears because he is afraid of failing you?'</text>
</svg>
