    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9f1239"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>
  <text x="490.0" y="48.0" fill="#334155" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;">The Stress Response: HPA Axis and the Family</text>
  <text x="490.0" y="74.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:400;">Chronic family conflict is a physiological dose, not only an emotional experience</text>
  <rect x="90.0" y="130.0" width="200.0" height="96.0" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5" opacity="1.0"/>
  <text x="190.0" y="156.0" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;">HYPOTHALAMUS</text>
  <text x="190.0" y="179.6" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">detects threat,</text>
  <text x="190.0" y="200.6" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">releases CRH</text>
  <rect x="390.0" y="110.0" width="200.0" height="96.0" rx="12" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5" opacity="1.0"/>
  <text x="490.0" y="136.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;">PITUITARY</text>
  <text x="490.0" y="159.6" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">releases ACTH into</text>
  <text x="490.0" y="180.6" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">the bloodstream</text>
  <rect x="700.0" y="130.0" width="200.0" height="96.0" rx="12" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="800.0" y="156.0" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:700;">ADRENAL GLANDS</text>
  <text x="800.0" y="179.6" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">cortisol + adrenaline</text>
  <text x="800.0" y="200.6" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">into circulation</text>
  <line x1="292.0" y1="178.0" x2="388.0" y2="158.0" stroke="#0f766e" stroke-width="2"/>
  <path d="M 377.2 155.1 L 388.0 158.0 L 379.2 164.9 z" fill="#0f766e"/>
  <text x="336.0" y="150.0" fill="#0f766e" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:600;">CRH</text>
  <line x1="592.0" y1="158.0" x2="698.0" y2="178.0" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 689.1 171.2 L 698.0 178.0 L 687.2 181.1 z" fill="#1d4ed8"/>
  <text x="649.0" y="150.0" fill="#1d4ed8" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:600;">ACTH</text>
  <rect x="62.0" y="288.0" width="196.0" height="76.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="160.0" y="312.0" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:600;">heart rate and blood pressure ↑</text>
  <text x="160.0" y="332.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">palpitations, tension</text>
  <line x1="300.0" y1="228.0" x2="160.0" y2="286.0" stroke="#b45309" stroke-width="1.1" stroke-dasharray="3 3"/>
  <rect x="280.0" y="288.0" width="196.0" height="76.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="378.0" y="312.0" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">sleep ↓</text>
  <text x="378.0" y="332.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">night waking, early rising</text>
  <line x1="500.0" y1="228.0" x2="378.0" y2="286.0" stroke="#b45309" stroke-width="1.1" stroke-dasharray="3 3"/>
  <rect x="498.0" y="288.0" width="196.0" height="76.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="596.0" y="312.0" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">digestion ↓</text>
  <text x="596.0" y="332.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">nausea, appetite change</text>
  <line x1="700.0" y1="228.0" x2="596.0" y2="286.0" stroke="#b45309" stroke-width="1.1" stroke-dasharray="3 3"/>
  <rect x="716.0" y="288.0" width="196.0" height="76.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" opacity="1.0"/>
  <text x="814.0" y="312.0" fill="#b45309" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600;">immune function ↓</text>
  <text x="814.0" y="332.0" fill="#5b6675" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.5px;font-weight:400;">colds, slow healing</text>
  <line x1="900.0" y1="228.0" x2="814.0" y2="286.0" stroke="#b45309" stroke-width="1.1" stroke-dasharray="3 3"/>
  <path d="M 160 286 C 120 330, 120 250, 150 228" fill="none" stroke="#9f1239" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="490.0" y="404.0" fill="#9f1239" text-anchor="middle" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:400;">negative feedback: cortisol signals the brain to switch the response off — unless the threat keeps returning</text>
  <rect x="60.0" y="424.0" width="860.0" height="140.0" rx="12" fill="#f8fafc" stroke="#c7d0da" stroke-width="1.5" opacity="1.0"/>
  <text x="84.0" y="452.0" fill="#334155" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;letter-spacing:0.8px;">WHEN THE STRESSOR IS THE RELATIONSHIP ITSELF</text>
  <text x="84.0" y="482.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;">Allostatic load</text>
  <text x="252.0" y="482.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.8px;font-weight:400;">the system never fully powers down</text>
  <text x="509.0" y="482.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;">Sensitised amygdala</text>
  <text x="677.0" y="482.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.8px;font-weight:400;">smaller triggers, bigger reactions</text>
  <text x="84.0" y="524.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;">Weaker prefrontal control</text>
  <text x="252.0" y="524.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.8px;font-weight:400;">harder to inhibit the sharp reply</text>
  <text x="509.0" y="524.0" fill="#0f766e" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;">Child cortisol patterns</text>
  <text x="677.0" y="524.0" fill="#5b6675" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:9.8px;font-weight:400;">linked to anxiety and sleep problems</text>
  <rect x="40.0" y="586.0" width="900.0" height="67.7" rx="10" fill="#fdf3e3" stroke="#f0d9b5" stroke-width="1.5" opacity="1.0"/>
  <text x="54.0" y="605.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.2px;">NOTE</text>
  <text x="54.0" y="626.0" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">This is why 'just calm down' fails: the body is running a script that predates the argument. Regulate first (breath, movement, safety), then reason. Couple</text>
  <text x="54.0" y="640.9" fill="#b45309" text-anchor="start" style="font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:400;">sessions that begin with 90 seconds of paced breathing look visibly different.</text>
</svg>
